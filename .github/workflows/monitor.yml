name: Amazon Stock Monitor

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests

      - name: Instalar Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Executar monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python amazon_check.py

      - name: Salvar estado
        if: success()
        run: |
          git config user.name "Amazon Stock Monitor"
          git config user.email "actions@github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Atualizar estado do monitor"
          git push

      - name: 🚨 Avisar erro no Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🚨 ERRO NO MONITOR AMAZON!

O monitor encontrou um erro durante a verificação. Verifique o GitHub Actions."
